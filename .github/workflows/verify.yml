name: verify

on:
  push:
    paths:
      - "problems/**"
      - "curriculum/**"
      - "requests/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SymPy
        run: pip install --quiet sympy

      - name: Rule R1 (no numbering or source identifiers in curriculum/)
        run: python3 tools/check_rules.py

      - name: Validate curriculum registry
        run: python3 tools/validate_curriculum.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify problem records
        run: python3 tools/verify.py
