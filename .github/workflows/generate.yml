name: generate

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of problems to attempt"
        default: "30"
      author_model:
        description: "Optional: engine to try first for writing (provider:model; bare = Gemini). Blank = tools/engines.json order"
        default: ""
      solver_model:
        description: "Optional: engine to try first for blind solving. Blank = tools/engines.json order"
        default: ""

permissions:
  contents: write

concurrency:
  group: commits-to-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SymPy
        run: pip install --quiet sympy

      - name: Generate batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COUNT: ${{ inputs.count }}
          AUTHOR_MODEL: ${{ inputs.author_model }}
          SOLVER_MODEL: ${{ inputs.solver_model }}
        run: python3 tools/generate.py

      - name: Publish summary
        if: always()
        run: cat candidates/*/README.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit candidates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates/
          git diff --staged --quiet && exit 0
          git commit -m "Add generated candidate batch"
          git pull --rebase
          git push
