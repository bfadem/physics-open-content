name: check-quota

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commits-to-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check remaining free quota
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 tools/check_quota.py

      - name: Publish summary
        run: cat docs/quota.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/quota.md
          git diff --staged --quiet && exit 0
          git commit -m "Update quota report"
          git pull --rebase
          git push
