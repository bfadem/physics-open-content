name: smoke-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List available Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/list_models.py
