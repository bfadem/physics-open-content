name: list-provider-models

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commits-to-main
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: List provider models (no generation quota used)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 tools/list_provider_models.py

      - name: Commit the listing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/provider-models.md
          git diff --staged --quiet && exit 0
          git commit -m "Update provider model listing"
          git pull --rebase
          git push
